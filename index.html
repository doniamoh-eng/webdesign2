<html>
    <head></head>
    <body>
        <form>
            <fieldset style="background-color: rgb(172, 41, 41);height: 700px;">
                <br>
                <legend style="background-color: #417981;">Personal Data</legend>
                <fieldset style="background-color: orange;">
                    <legend style="background-color:#38a3b1;"><br> Your Name <br> <br></legend>
                    <table>
                        <br>
                        <tr>
                            <td><label for="fName">First name</label></td>
                            <td><label for="fName">:</label></td>
                            <td><input type="text" id="fName" name="firstName" placeholder="ex.donia"></td>
                        </tr>
                        <tr>
                            <td><label for="lName">Last name</label></td>
                            <td><label for="lName">:</label></td>
                            <td><input type="text" id="lName" name="lastName" placeholder="ex.mohamed"></td>
                        </tr>
                    </table>
                </fieldset>
                <br>
                <br>
                <table>
                    <tr>
                        <td><label for="phone">Your Phone</label></td>
                        <td><label for="phone">:</label></td>
                        <td><input type="tel" id="phone" name="phone"></td>
                    </tr>
                    <tr>
                        <td><label for="email">Email</label></td>
                        <td><label for="email">:</label></td>
                        <td><input type="email" id="email" name="email"></td>
                    </tr>
                    <tr>
                        <td><label for="password">Password</label></td>
                        <td><label for="password">:</label></td>
                        <td><input type="password" id="password" name="password"></td>
                    </tr>
                    <tr>
                        <td><label for="rePassword">Re-Password</label></td>
                        <td><label for="rePassword">:</label></td>
                        <td><input type="password" id="rePassword" name="rePassword"></td>
                    </tr>
                </table>
                <br>
                <table>
                    <tr>
                        <td><label for="male">Male</label></td>
                        <td><label for="male">:</label></td>
                        <td><input type="radio" name="gender" id="male" value="male"></td>
                    </tr>
                    <tr>
                        <td><label for="female">Female</label></td>
                        <td><label for="female">:</label></td>
                        <td><input type="radio" name="gender" id="female" value="female"></td>
                    </tr>
                </table>
                <br>
                <table>
                    <tr>
                        <td><label for="student">Student</label></td>
                        <td><label for="graduate">:</label></td>
                        <td><input type="checkbox" name="status" id="student" value="student"></td>
                    </tr>
                    <tr>
                        <td><label for="graduate">Graduate</label></td>
                        <td><label for="graduate">:</label></td>
                        <td><input type="checkbox" name="status" id="graduate" value="graduate"></td>
                    </tr>
                </table>
                <br>
                <select name="selectedOption" >
                    <optgroup label="Group 1">
                        <option> Option 1.1 </option>
                    </optgroup>
                    <optgroup label="Group 2">
                        <option> Option 2.1 </option>
                        <option> Option 2.2 </option>
                    </optgroup>
                    <optgroup label="Group 3" disabled>
                        <option> Option 3.1 </option>
                        <option> Option 3.2 </option>
                        <option> Option 3.3 </option>
                    </optgroup>
                </select>
                <br>
                <br>
                <br>
                <input type="image" src="./img/button image.jpg" width="100px" alt="button image">
                
            </fieldset>
        </form>
    </body>
</html>
